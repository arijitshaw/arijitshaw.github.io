</style>
<text x="52.0" y="52.0" class="th" text-anchor="start">The river that leaves the country and comes back</text>
<text x="52.0" y="78.0" class="ts" text-anchor="start">The Pare Chu rises in India, spends its middle life in Tibet, and comes back to join the Spiti.</text>
