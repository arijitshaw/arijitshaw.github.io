<svg xmlns="http://www.w3.org/2000/svg" width="980" height="706" viewBox="0 0 980 706" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The river that leaves the country and comes back</title>
<desc id="dsc">Schematic of the Pare Chu. It rises in India below Parang La, crosses into Tibet, loops east and south, and re-enters India to join the Spiti at Sumdo. The site of the 2004 landslide dam is marked on the Tibetan reach.</desc>
