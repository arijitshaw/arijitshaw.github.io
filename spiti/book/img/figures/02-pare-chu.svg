<text x="724.0" y="528.0" class="tb ta" text-anchor="start">June 2005</text>
<text x="724.0" y="550.0" class="ts" text-anchor="start">A landslide dammed the river on</text>
<text x="724.0" y="566.0" class="ts" text-anchor="start">this reach in 2004. The lake burst</text>
<text x="724.0" y="582.0" class="ts" text-anchor="start">on 26 June 2005, tore out NH-22</text>
<text x="724.0" y="598.0" class="ts" text-anchor="start">from Sumdo down to Wangtu, and</text>
<text x="724.0" y="614.0" class="ts" text-anchor="start">5,000 people were moved off the</text>
<text x="724.0" y="630.0" class="ts" text-anchor="start">Sutlej. Nobody was killed.</text>
<text x="52.0" y="680.0" class="ts" text-anchor="start">About 210 km from source to mouth, most of the middle inside Tibet. India gets no gauge readings from that stretch.</text>
</svg>
