<text x="52.0" y="52.0" class="th" text-anchor="start">Four rivers, four directions, one mountain</text>
<text x="52.0" y="78.0" class="ts" text-anchor="start">Nowhere else do four rivers this size start this close together. It is why Kailash is sacred four times over.</text>
