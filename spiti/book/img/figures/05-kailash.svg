<text x="208.0" y="440.0" class="tb tw" text-anchor="end">Sutlej</text>
<text x="208.0" y="458.0" class="ts" text-anchor="end">the Elephant&#x27;s Mouth</text>
<text x="208.0" y="474.0" class="ts" text-anchor="end">west, and this is your river</text>
<text x="52.0" y="802.0" class="ts" text-anchor="start">The Tibetan names are the mouths of four animals. The four rivers run to four different seas, and the mountain at</text>
<text x="52.0" y="819.0" class="ts" text-anchor="start">their centre is holy to Hindus, Buddhists, Jains and the Bon — four faiths, four rivers, four directions. The Sutlej</text>
<text x="52.0" y="836.0" class="ts" text-anchor="start">is the one you will drive beside for four days, about a thousand kilometres downstream of this page.</text>
</svg>
