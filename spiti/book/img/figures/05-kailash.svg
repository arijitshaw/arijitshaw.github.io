<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Four rivers, four directions, one mountain</title>
<desc id="dsc">Radial diagram of Mount Kailash. The Indus rises to the north, the Brahmaputra to the east, the Karnali to the south and the Sutlej to the west, all within about a hundred kilometres of the same peak.</desc>
