</style>
<text x="52.0" y="52.0" class="th" text-anchor="start">Spiti was a crossroads, not a cul-de-sac</text>
<text x="52.0" y="78.0" class="ts" text-anchor="start">Six ways out on foot. Every one of them is now a trek rather than a route.</text>
