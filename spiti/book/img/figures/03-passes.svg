<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="862" viewBox="0 0 980 862" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Spiti was a crossroads, not a cul-de-sac</title>
<desc id="dsc">Spoke diagram centred on Kaza showing six historic pass routes out of Spiti — Parang La north to Ladakh, Shipki La east to Tibet, Manirang south to Kinnaur, Pin-Bhaba south-west to Kinnaur, Pin-Parvati west to Kullu and Kunzum La north-west to Lahaul — with the single modern road overlaid.</desc>
<style>
  .ink   { stroke:#2f2b26; fill:none; stroke-linecap:round; stroke-linejoin:round }
  .fine  { stroke:#2f2b26; fill:none; stroke-width:.9; stroke-linecap:round; opacity:.75 }
  .water { stroke:#2d6f91; fill:none; stroke-linecap:round; stroke-linejoin:round }
  .acc   { stroke:#b34a2c; fill:none; stroke-linecap:round; stroke-linejoin:round }
