  .fillt { fill:#96682f; stroke:none; opacity:.16 }
  text   { fill:#2f2b26; font-family:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif }
  .t     { font-size:15px }
  .tb    { font-size:16px; font-weight:600 }
  .th    { font-size:21px; font-weight:600 }
  .ts    { font-size:12.5px; font-style:italic; opacity:.72 }
  .tn    { font-size:12px; opacity:.8 }
  .tw    { fill:#2d6f91 }
  .ta    { fill:#b34a2c }
  .twd   { fill:#96682f }
  @media (prefers-color-scheme: dark) {
    .ink, .fine { stroke:#e6e0d4 }
    .water { stroke:#7cb6d4 } .acc { stroke:#e08a6b } .wood { stroke:#cca06a }
    .fillw { fill:#7cb6d4 } .filla { fill:#e08a6b } .filli { fill:#e6e0d4; opacity:.10 }
    .fillt { fill:#cca06a }
    text { fill:#e6e0d4 }
    .tw { fill:#7cb6d4 } .ta { fill:#e08a6b } .twd { fill:#cca06a }
