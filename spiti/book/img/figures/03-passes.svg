<text x="52.0" y="806.0" class="ts" text-anchor="start">Before the road, Spiti sat where six valleys met and traded in every direction: salt and wool down from Tibet, grain up from</text>
<text x="52.0" y="823.0" class="ts" text-anchor="start">Kinnaur, horses north to Ladakh, pilgrims west to Kullu. The road did not open Spiti up. It shut five doors and widened the sixth.</text>
